# Diarizer local settings. Paths under [llm].model are relative to models/.

[llm]
#model = "llm/Ling-3.0-tiny-Q8_XL_MOE.gguf"
model = "llm/maple-preview-TQ2_0-head-F16.gguf"
summarize = true

# -1 = generate until EOS (do not artificially truncate the summary).
n_predict = -1
# Per-call context. Long transcripts are auto-chunked to fit.
ctx_size = 32768
temperature = 0.2
gpu_layers = 99
# Russian transcripts are denser than English; ~2 chars/token is conservative.
chars_per_token = 2.0

# Stop maple/Ling-style "[Start thinking]" loops.
reasoning = "off"
reasoning_budget = 0
# Guardrails against infinite repetition (instead of capping n_predict).
repeat_penalty = 1.2
presence_penalty = 0.0
frequency_penalty = 0.0
dry_multiplier = 0.0

# Prompt for meeting summarization. {transcript} is replaced with the
# speaker-labeled (or plain) transcript text.
prompt = """
Ты — ассистент, который составляет краткое резюме рабочей встречи.
Ниже дан транскрипт разговора (возможно с метками спикеров и таймкодами).

Сделай структурированное резюме на русском языке:

## Кратко
2–4 предложения: о чём была встреча и чем закончилась.

## Участники и роли
Кто говорил (Speaker 1 / Speaker 2 / имена, если есть) и в каком качестве, если это ясно из текста.

## Основные темы
Маркированный список ключевых обсуждавшихся тем.

## Решения
Что было решено или согласовано. Если решений не было — так и напиши.

## Задачи и договорённости
Список action items в формате:
- Что сделать — кто (если известно) — срок (если назван)

## Открытые вопросы
Что осталось нерешённым или требует уточнения.

## Риски / важное
Критичные замечания, блокеры, дедлайны.

Правила:
- Опирайся только на транскрипт, ничего не выдумывай.
- Если чего-то нет в тексте — пиши «не указано», не додумывай.
- Пиши деловым, ясным языком; без воды.
- Сохраняй имена, цифры, даты и названия продуктов как в оригинале.
- Сразу выдай финальный markdown-ответ. Без блока рассуждений, без «thinking», без цитирования транскрипта целиком и без повторов одной и той же фразы.

Транскрипт:
{transcript}
"""

merge_prompt = """
Ты — ассистент, который объединяет частичные резюме одной встречи в одно финальное.

Ниже несколько резюме отдельных фрагментов одного и того же транскрипта.
Собери единое структурированное резюме на русском языке без дублей.

## Кратко
2–4 предложения.

## Участники и роли

## Основные темы

## Решения

## Задачи и договорённости
- Что сделать — кто — срок

## Открытые вопросы

## Риски / важное

Правила:
- Опирайся только на частичные резюме, ничего не выдумывай.
- Объединяй повторы; сохраняй имена, цифры и даты.
- Пиши деловым языком, без воды.
- Сразу выдай финальный markdown. Без блока рассуждений, без цитирования исходного текста целиком.

Частичные резюме:
{transcript}
"""
