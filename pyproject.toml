[project]
name = "diarizer"
version = "0.1.0"
description = "Local mic+system meeting recorder with Whisper and pyannote diarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.30.0",
    "numpy>=2.5.3",
    "openai-whisper>=20250625",
    "pyannote-audio>=4.0.7",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
]

[project.optional-dependencies]
win = [
    "pyaudiowpatch>=0.2.12.8 ; sys_platform == 'win32'",
]

[project.scripts]
diarizer = "diarizer:main"
diarizer-download-models = "diarizer.download_models:main"
diarizer-summarize = "diarizer.summarize:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Resolve Windows loopback extra while developing on macOS.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
